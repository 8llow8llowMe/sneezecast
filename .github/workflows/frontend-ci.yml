name: frontend-ci

# **프론트엔드 PR 에서 `pnpm qa:verify` 와 같은 검사를 돌린다.**
#
# CI 통과가 머지 조건이다(루트 CLAUDE.md). 브랜치 보호(required status check)는 걸려 있지 않아
# 빨간불이어도 머지 버튼은 눌린다. **빨간불 PR 은 머지하지 않는다**는 규칙으로 지킨다.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/classify-frontend-changes.sh'
      - '.github/workflows/frontend-ci.yml'
  # **develop 에서도 돈다 — 캐시 때문이다.**
  #
  # Actions 는 **기본 브랜치 스코프 캐시만 모든 PR 이 상속**한다. `pull_request` 실행이 저장한
  # 캐시는 `refs/pull/N/merge` 스코프라 그 PR 안에서만 읽힌다. 이 트리거가 없으면 base 스코프
  # 캐시가 생기지 않아 PR 마다 pnpm store 를 처음부터 받는다.
  #
  # 겸사겸사 머지된 develop 자체를 검사한다. `pull_request` 는 머지 **전** 트리를 본다.
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - 'scripts/classify-frontend-changes.sh'
      - '.github/workflows/frontend-ci.yml'

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 버린다. rebase 를 몇 번 하면 러너에 겹쳐 쌓인다
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 무엇이 바뀌었는지 먼저 가른다. `frontend/` 에서 문서만 바뀐 PR 은 `format:check` 만 돈다.
  #
  # **판정 기준은 `scripts/classify-frontend-changes.sh` 한 곳에 있다.**
  # develop push 는 늘 `code` 다 — base 스코프 캐시를 만들고 머지된 develop 을 검사하는 목적이라
  # 건너뛰면 안 된다. 판정이 실패하면 `code` 로 본다. 모르는 것을 "안 바뀌었다" 로 읽지 않는다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          kind=code
          if [ "$EVENT_NAME" = "pull_request" ] && git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            # PR 체크아웃은 base 위에 PR 을 얹은 머지 커밋이라, base 와의 차이가 곧 PR 의 변경이다
            kind=$(git -c core.quotepath=off diff --name-only "$BASE_SHA" HEAD | sh scripts/classify-frontend-changes.sh) || kind=code
          fi
          echo "kind=$kind" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    runs-on: ubuntu-latest
    # Lighthouse(아래, 10분 상한)를 더해 늘렸다. 검사 단계만으로는 15분 안에 끝난다
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package.json 이 frontend/ 에 있다. `defaults.run.working-directory` 는 액션 입력에
      # 적용되지 않으므로 경로를 명시해야 packageManager(pnpm 버전)를 읽는다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 문서만 바뀐 PR 도 포맷 검사는 돈다 — `.md` 도 prettier 대상이다
      - run: pnpm format:check
      - run: pnpm lint
        if: needs.changes.outputs.kind == 'code'
      - run: pnpm typecheck
        if: needs.changes.outputs.kind == 'code'
      - run: pnpm test
        if: needs.changes.outputs.kind == 'code'

      # server/client 경계 오류 등은 빌드에서만 잡히는 것이 많다.
      # `NEXT_PUBLIC_*` 는 빌드 시점에 인라인되므로 dev 값을 넣어 실제 배포와 같은 조건으로 빌드한다
      - run: pnpm build
        if: needs.changes.outputs.kind == 'code'
        env:
          NEXT_PUBLIC_SITE_URL: https://dev.sneezecast.com
          NEXT_PUBLIC_API_BASE_URL: https://api-dev.sneezecast.com

      # **Lighthouse — 경고만 낸다(#177).** 위 빌드를 그대로 `next start -p 3100` 으로 띄워 모바일 기본 설정으로
      # URL 마다 3회 잰다(lighthouserc.yml, 측정 방법 · 예산 · 기준선은 docs/performance.md).
      # - `continue-on-error` 라 수집 실패 · 시간 초과가 이 잡을 빨간불로 만들지 않는다. 예산은 모두 `warn` 이라 넘어도 통과다.
      # - 결과는 외부(temporary-public-storage · LHCI 서버)에 올리지 않는다. 요약(Step Summary)과 아티팩트로만 남긴다.
      # - 러너에 깔린 Google Chrome 을 쓴다(내려받지 않음). ubuntu 러너는 Chrome 샌드박스를 쓸 수 없어 `--no-sandbox` 를 준다.
      # - 문서만 바뀐 PR(`docs`)은 빌드가 없어 돌지 않는다(scripts/classify-frontend-changes.sh).
      - name: Lighthouse (경고만)
        id: lighthouse
        if: needs.changes.outputs.kind == 'code'
        continue-on-error: true
        timeout-minutes: 10
        # 측정 전 확인(포트 · 빌드 · 지난 결과 정리)은 로컬 `pnpm perf:lighthouse` 와 같다 — scripts/lighthouse-preflight.mjs
        run: |
          node scripts/lighthouse-preflight.mjs
          pnpm exec lhci autorun --config=lighthouserc.yml --collect.settings.chromeFlags="--headless=new --no-sandbox"

      # 수집이 돌았을 때만(성공 · 실패) 요약 · 아티팩트를 남긴다. 앞 단계가 실패해 건너뛰었으면 남기지 않는다.
      # 요약은 표 · 기기 지표 · 경고(예산 초과 · 리다이렉트)를 Step Summary 에 붙이고, 경고가 있으면 `::warning` 으로
      # 체크 화면에 띄운다(차단하지 않음). 결과가 없으면 이 단계가 실패하지만 `continue-on-error` 라 잡은 초록불이다
      - name: Lighthouse 요약
        if: steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure'
        continue-on-error: true
        run: node scripts/lighthouse-summary.mjs --github

      # `.lighthouseci` 는 숨김 폴더라 `include-hidden-files` 가 없으면 통째로 빠진다(기본 false).
      # 실행마다의 HTML 보고서(report/)와 예산 확인 결과만 올린다 — 같은 HTML 이 `.lighthouseci/lhr-*.html` 에도 있어 중복을 뺀다
      - uses: actions/upload-artifact@v4
        if: steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure'
        continue-on-error: true
        with:
          name: lighthouse-report
          path: |
            frontend/.lighthouseci/report/
            frontend/.lighthouseci/assertion-results.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
