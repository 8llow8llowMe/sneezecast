# 로컬 인프라를 두지 않고 팀 개발 서버에 바로 배포하므로 local 프로파일이 없다. 기본값은 dev 다.
# 값은 env 로 받고, 배포 때 Vault 에서 주입한다.
spring:
  application:
    name: ${SPRING_APPLICATION_NAME:service-discovery}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 다른 앱은 common-core 의 observability-common.yml 을 import 한다. 이 모듈은 common-core 에 의존하지 않아
# (jasypt · springdoc 을 끌고 온다) 같은 내용을 여기 둔다. 바꾸면 common-core 쪽도 함께 고친다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      profile: ${SPRING_PROFILES_ACTIVE:${spring.profiles.active:dev}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN
