# 로컬 인프라를 두지 않고 팀 개발 서버에 바로 배포하므로 local 프로파일이 없다. 기본값은 dev 다.
# 값은 env 로 받고, 배포 때 Vault 에서 주입한다.
spring:
  application:
    # 게이트웨이의 SURVEILLANCE_SERVICE_APP_NAME 과 같은 값이어야 한다 (lb:// 라우트 대상).
    name: ${SPRING_APPLICATION_NAME:surveillance-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Snowflake ID (weekly_report 등 이 서비스가 만드는 행의 PK). ID 는 같은 테이블 안에서만 겹치지 않으면 된다 — auth 는 DB 가 다르고, batch(worker 1 · 2)는
# 같은 스키마지만 district · official_* 에만 쓰고 surveillance 는 그 테이블에 쓰지 않으므로 auth 와 같은 기본값(0/0)이어도 충돌하지 않는다.
# 인스턴스를 늘리면 인스턴스마다 다른 worker-id 를 env 로 준다 (0~31, 범위 밖이면 기동 실패).
snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
  worker-id: ${SNOWFLAKE_WORKER_ID:0}

# 집계 단계 판정 규칙 (aggregate 컨텍스트, entity-design §2-2). 잘못되면 기동 실패 (AggregateRule 이 검사한다).
# 이 파일이 정본이다. ${...} 자리표시자를 두지 않고, 배포 설정(compose · Vault)에 AGGREGATE_* 를 넣지 않는다 — relaxed binding 으로 환경변수가
# 이 값을 덮으면 rule-version 은 그대로인 채 규칙만 바뀐다. 집계 행마다 rule_version 을 남겨 과거 판정을 설명하므로,
# **값을 하나라도 바꾸면 rule-version 도 바꾼다.**
aggregate:
  # 공백이 아닌 20자 이하 (rule_version 컬럼). 규칙을 정한 날짜로 짓는다.
  rule-version: "2026-10-08"
  # 최소 표본(참여자 수). 미만이면 자료 부족(LOW_SAMPLE). 시안의 publicThresholdParticipants 와 같은 값이다.
  min-sample: 100
  # 전주 대비 참여자 변화율(%)이 이 값 이상이면 자료 부족(UNSTABLE). 마감 판정에서만 보고, 전주가 없거나 표본 미달이면 보지 않는다.
  unstable-change-percent: 50
  # 증상 보고 비율이 기준선보다 이 %p 이상 높으면 조금 늘었어요(SLIGHT) · 많이 늘었어요(HIGH). 시안의 slightDeltaPp · highDeltaPp 와 같다.
  # high 는 slight 보다 크고 100 이하.
  slight-delta-pp: 3
  high-delta-pp: 8
  # 기준선 = 직전 baseline-lookback-weeks 주 중 마감됐고 · 표본이 충분하고 · 급변이 아닌 최근 baseline-weeks 주의 합산 비율(Σ증상 / Σ참여).
  # 모자라면 자료 부족(NO_BASELINE). lookback 은 baseline-weeks 이상.
  baseline-weeks: 4
  baseline-lookback-weeks: 8

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN
    # Hibernate 는 SQL 오류마다 DB 메시지를 ERROR 로 찍는다. 같은 주 동시 제출의 unique 위반 메시지에는 reporter_key · 주 값이
    # 실려(Duplicate entry '<키>-<주>') 정상 경로인 경합마다 가명 키가 로그에 남는다. 끄고, 다른 SQL 오류는 번역된 예외로 드러낸다.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
