// 공통 의존성(actuator · prometheus · Spring Cloud BOM)은 루트 build.gradle 의 cloudAppModules 가 처리한다.

// Spring Boot 3.4.5 BOM 의 Testcontainers 1.20.6 은 Docker Engine 29(최소 API 1.44)에 붙지 못한다. BOM 버전 속성을 이 모듈에서만 덮어
// 1.21.x 로 올린다 — 다른 모듈은 Testcontainers 를 쓰지 않는다. Spring Boot 를 올려 BOM 이 1.21 이상이 되면 이 줄을 지운다.
ext['testcontainers.version'] = '1.21.4'
dependencies {
    implementation project(':core:common-core')
    implementation project(':core:persistence-core')
    implementation project(':core:redis-core')
    implementation project(':core:security-core')
    implementation project(':core:storage-core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // security-core 가 필터 체인을 만들지만, 컨트롤러의 @PreAuthorize 는 이 서비스가 직접 컴파일한다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // 이메일 인증코드 발송
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 인증 메일 HTML 템플릿 렌더링. REST 서비스라 MVC 뷰 리졸버를 끌어오는 starter 대신 엔진만 쓴다.
    implementation 'org.thymeleaf:thymeleaf'
    // Entity ↔ Domain 매핑 (coding-conventions §4). lombok 보다 뒤에 돌도록 binding 을 함께 건다.
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    // OpenAPI 문서 빈(AuthServiceSwaggerConfig)과 컨트롤러 Swagger 어노테이션용. 버전은 common-core 와 같게 둔다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 컨텍스트 로딩 테스트(AuthServiceApplicationTests)가 실제 MySQL 없이 JPA 까지 조립해 본다.
    testRuntimeOnly 'com.h2database:h2'
    // refresh 세션 Lua 스크립트를 실제 Redis 로 검증한다(RedisRefreshSessionStoreAdapterIntegrationTest). 버전은 위 testcontainers.version.
    // CI 가 아니고 Docker 도 없을 때(로컬 Windows)만 그 테스트를 건너뛴다 — CI(GitHub Actions ubuntu)에서 Docker 에 못 붙으면 실패한다.
    testImplementation 'org.testcontainers:junit-jupiter'
}
