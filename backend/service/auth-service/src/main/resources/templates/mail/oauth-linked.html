<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(preheader='계정에 카카오 로그인이 연결되었습니다.', heading='우리동네체온계 카카오 로그인 연결 안내', content=~{::content})}">
<body>
<th:block th:fragment="content">
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">이 이메일의 우리동네체온계 계정에 카카오 로그인이 연결되었습니다.</p>
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">이제 이메일과 비밀번호, 또는 카카오로 로그인할 수 있습니다.</p>
  <p class="m-muted" style="margin:20px 0 0 0; font-size:13px; line-height:20px; color:#596069;">본인이 연결하지 않았다면 설정의 로그인 기기에서 모르는 기기를 로그아웃하고 서비스에 알려주세요.</p>
</th:block>
</body>
</html>
