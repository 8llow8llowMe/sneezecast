# 로컬 인프라를 두지 않고 팀 개발 서버에 바로 배포하므로 local 프로파일이 없다. 기본값은 dev 다.
# 값은 env 로 받고, 배포 때 Vault 에서 주입한다.
spring:
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      # Redis 는 템플릿으로 TTL 키-값만 다룬다. 리포지터리 스캔은 JPA 만 하게 해서, 리포지터리가 어느 저장소 것인지 헷갈릴 여지를 없앤다.
      repositories:
        enabled: false
  # 서비스 간 호출(Feign) 공통 timeout — 내 동네 · 관심 동네의 surveillance 행정동 확인과 원시 보고 파기 스케줄러가 쓴다. 행정동 확인은 사용자
  # 요청 경로라 게이트웨이 응답 상한(GATEWAY_RESPONSE_TIMEOUT 10s)보다 훨씬 짧게 둔다: 같은 망의 단건 PK 조회라 정상이면 수십 ms 이고, 늦으면
  # 기다리지 않고 503 으로 끝낸다. 파기는 한 회원의 보고(최대 52주)를 지우는 짧은 벌크 삭제라 같은 값으로 충분하다 — 넘기면 다음 회차에 다시 부른다.
  # 관심 동네 목록은 동네마다(region.interest.max-count, 기본 3) 순차로 부른다 — 모두 read-timeout 직전에 겨우 답하면 합이 게이트웨이 상한을
  # 넘을 수 있다(그때는 게이트웨이 504). timeout 을 늘리거나 상한을 키울 때 함께 본다.
  # 서킷 자동 래핑(spring.cloud.openfeign.circuitbreaker.enabled)은 끈 채 둔다 — InternalClientSupport 가 감싼다.
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000

infra:
  redis:
    # 게이트웨이와 같은 값이어야 한다 — access token 블랙리스트 키를 auth 가 쓰고 게이트웨이가 읽는다.
    key-prefix: ${REDIS_KEY_PREFIX:sneezecast}

# Snowflake ID. 서비스마다 DB 가 따로라 ID 는 서비스 안에서만 겹치지 않으면 된다 — 환경당 인스턴스가 하나인 동안 기본값으로 충분하다.
# 인스턴스를 늘리면 인스턴스마다 다른 worker-id 를 env 로 준다 (0~31, 범위 밖이면 기동 실패).
snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
  worker-id: ${SNOWFLAKE_WORKER_ID:0}

# 관심 동네(region 컨텍스트). 0 이하면 기동 실패. 환경변수로 받지 않는다 — 프론트 상수 INTEREST_REGION_LIMIT 과 같은 값이어야 해서 이 파일이 정본이다.
region:
  interest:
    # 회원당 관심 동네 상한(내 동네는 세지 않는다). 줄여도 이미 고른 동네는 지우지 않고 더 고르지 못하게만 한다.
    max-count: 3

auth:
  # 인증 메일 발신자 표시. 비면 "우리동네체온계" / SMTP 계정 주소.
  mail:
    from-name: ${MAIL_FROM_NAME:우리동네체온계}
    from-address: ${MAIL_FROM_ADDRESS:}
  # 가입용 이메일 인증 한도 · 수명. 0 이하면 기동 실패. compose 가 같은 기본값을 넘긴다.
  email-send:
    # IP 당 발송 상한 — 쿨다운에 막히지 않고 실제로 발송한 요청만 센다. 저장소 장애에는 fail-open.
    ip-max-send-count: ${AUTH_EMAIL_SEND_IP_MAX_COUNT:10}
    ip-window: ${AUTH_EMAIL_SEND_IP_WINDOW:PT1H}
    resend-cooldown: ${AUTH_EMAIL_SEND_RESEND_COOLDOWN:PT60S}
    code-ttl: ${AUTH_EMAIL_SEND_CODE_TTL:PT5M}
    # 인증 완료 표시 수명 — 이 안에 가입해야 한다.
    verified-ttl: ${AUTH_EMAIL_SEND_VERIFIED_TTL:PT30M}
    max-verify-failures: ${AUTH_EMAIL_SEND_MAX_VERIFY_FAILURES:5}
    # IP 당 검증 요청 상한 — 여러 이메일에 걸친 코드 대입을 늦춘다. 저장소 장애에는 fail-open.
    verify-ip-max-count: ${AUTH_EMAIL_SEND_VERIFY_IP_MAX_COUNT:30}
    verify-ip-window: ${AUTH_EMAIL_SEND_VERIFY_IP_WINDOW:PT1H}
  # 이메일 로그인 실패 제한. 0 이하면 기동 실패. compose 가 같은 기본값을 넘긴다. 둘 다 저장소 장애에는 fail-open.
  login:
    # 같은 이메일로 이 횟수째 실패하면 lock-duration 동안 잠근다 (가입 여부와 무관하게 이메일 키로). 실패 카운터 수명도 lock-duration 이다.
    max-failure-count: ${AUTH_LOGIN_MAX_FAILURE_COUNT:5}
    lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT10M}
    # 한 IP 의 실패가 ip-window 안에 이 횟수에 닿으면 그 IP 의 다음 로그인 시도를 막는다.
    ip-max-failure-count: ${AUTH_LOGIN_IP_MAX_FAILURE_COUNT:30}
    ip-window: ${AUTH_LOGIN_IP_WINDOW:PT1H}
  # 로그인 세션(기기). 0 이하면 기동 실패. compose 가 같은 기본값을 넘긴다.
  session:
    # 회원당 동시 로그인 기기 수. 넘으면 마지막 사용이 가장 오래된 기기부터 밀어낸다.
    max-devices: ${AUTH_SESSION_MAX_DEVICES:5}
    # refresh 회전 직후 직전 토큰을 동시 재발급 경합(409)으로 봐주는 시간. 지나서 오면 재사용으로 보고 세션을 폐기한다.
    rotation-grace: ${AUTH_SESSION_ROTATION_GRACE:PT10S}
  # 비밀번호 재설정. 코드 한도 · 수명은 email-send 를 그대로 쓰고(키만 따로), 여기는 코드를 맞힌 뒤 받는 1회용 토큰의 수명이다.
  # 0 이하면 기동 실패. compose 가 같은 기본값을 넘긴다.
  password-reset:
    token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:PT15M}
  # 카카오 로그인의 일회용 값 수명. 쿠키 Max-Age 도 같은 값이다. 0 이하면 기동 실패. compose 가 같은 기본값을 넘긴다.
  oauth:
    # 인가 요청 state — 이 안에 카카오 동의 화면을 마치고 돌아와야 한다.
    state-ttl: ${AUTH_OAUTH_STATE_TTL:PT10M}
    # 신규 가입표 — 동네 · 성인 확인 · 가입 동의 화면을 거치는 시간.
    signup-ticket-ttl: ${AUTH_OAUTH_SIGNUP_TICKET_TTL:PT30M}
    # 기존 이메일 계정에 카카오 로그인을 연결할지 묻는 확인표.
    link-ticket-ttl: ${AUTH_OAUTH_LINK_TICKET_TTL:PT10M}
    # 인가 주소(state) 발급의 IP 상한 — 인증 없이 부르는 API 라 state 키로 Redis 를 채우지 못하게 한다. 넘으면 AUTH_028(429). 저장소 장애에는 fail-open.
    authorize-ip-max-count: ${AUTH_OAUTH_AUTHORIZE_IP_MAX_COUNT:30}
    authorize-ip-window: ${AUTH_OAUTH_AUTHORIZE_IP_WINDOW:PT10M}
  # 원시 보고 파기 스케줄러 (entity-design §1-5). 0 이하면 기동 실패(initial-delay 만 0 허용). compose 가 같은 기본값을 넘긴다.
  report-purge:
    # true / false 만 받는다(대소문자 무시, 그 밖의 값은 기동 실패). 여기 기본값은 꺼짐이다 — 테스트 컨텍스트 · 개발자 PC 가 surveillance 를
    # 부르지 않게 한다. 꺼져 있으면 기동 때 WARN 을 남긴다.
    # 배포는 compose 가 기본 true 로 넘긴다(dev · prod 모두). 파기는 법적 의무라 배포 환경에서 끄지 않는다.
    scheduler-enabled: ${AUTH_REPORT_PURGE_SCHEDULER_ENABLED:false}
    # 기동 뒤 첫 회차까지. Eureka 등록 · 서킷이 안정될 시간을 준다.
    initial-delay: ${AUTH_REPORT_PURGE_INITIAL_DELAY:PT1M}
    # 한 회차가 끝난 뒤 다음 회차까지.
    fixed-delay: ${AUTH_REPORT_PURGE_FIXED_DELAY:PT5M}
    # 완료 판정 여유 — 호출 시작이 요청 시각 + access token 수명(jwt.access-expiration) + 이 값 이후인 파기 호출이 성공해야 완료다.
    # 1차 파기는 바로 부르고, 2차는 이 대기 시간이 지난 뒤에만 부른다.
    completion-margin: ${AUTH_REPORT_PURGE_COMPLETION_MARGIN:PT5M}
    # 한 회차에 부를 요청 상한 (요청 시각 순).
    batch-size: ${AUTH_REPORT_PURGE_BATCH_SIZE:50}
    # 실패 기록 뒤 시도 횟수가 이 값 이상이면 ERROR 경보 로그. 행을 지우거나 포기하지 않는다. 5분 주기라 기본 12 ≒ 1시간 실패.
    alert-attempt-threshold: ${AUTH_REPORT_PURGE_ALERT_ATTEMPT_THRESHOLD:12}
    # 완료 행 보관 기간 (파기 증빙, entity-design §8). 미완료 행은 기간과 상관없이 남긴다.
    retention: ${AUTH_REPORT_PURGE_RETENTION:P365D}
    # 완료 행 정리 시각 (Spring cron, 초가 맨 앞. 배포 시간대와 상관없이 Asia/Seoul 기준). 기본 매일 04:30.
    cleanup-cron: "${AUTH_REPORT_PURGE_CLEANUP_CRON:0 30 4 * * *}"

# 카카오 로그인. 앱 키 · 시크릿 · 콜백 주소는 기본값이 없다(Vault auth-service 경로, 비거나 공백이면 기동 실패).
# 콜백 주소는 프론트 콜백 페이지(예: https://dev.sneezecast.com/login/kakao/callback)이고 카카오 개발자 콘솔에 등록한 값과 같아야 한다.
# 동의 항목은 account_email · profile_nickname 만 받는다(프로필 이미지는 받지 않는다 — 최소 수집).
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    # 로그인 요청 경로에 있으므로 짧게 둔다 (coding-conventions §9 — 모든 외부 호출에 timeout). 로그인 한 번에 두 번(토큰 · 사용자 정보) 부르므로
    # 최악 합계(연결 + 응답) × 2 가 게이트웨이 response-timeout(10초)보다 넉넉히 짧아야 한다.
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:PT1S}
    read-timeout: ${KAKAO_READ_TIMEOUT:PT2S}

# 가입 동의 이력(member_consent.document_version)에 남길 문서 버전. 20자 이하, 비면 기동 실패.
# 정본은 프론트 legal 상수다 — 문서를 개정할 때 두 곳을 같은 배포에 올리지 않으면 "무엇에 동의했는가"가 어긋난다.
legal:
  terms-version: ${LEGAL_TERMS_VERSION:2026-10-01}
  privacy-version: ${LEGAL_PRIVACY_VERSION:2026-10-01}
  sensitive-health-info-version: ${LEGAL_SENSITIVE_HEALTH_INFO_VERSION:2026-10-01}

management:
  health:
    mail:
      # health 가 호출마다 SMTP 에 접속하지 않게 한다. 메일 서버 장애는 발송 실패 로그로 보고, 서비스 생존 판정에 섞지 않는다.
      enabled: false

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 서비스 간 호출(Feign) 대상의 Eureka 등록명. 키는 논리명이고 @FeignClient(name = "${feign-client.target-services.<논리명>:<논리명>}") 이 읽는다
# (coding-conventions §9). surveillance 의 SPRING_APPLICATION_NAME 과 같은 공통 키 SURVEILLANCE_SERVICE_APP_NAME 을 따른다 —
# 게이트웨이 라우트와 같은 값이라, 이름을 바꿔도 내 동네 저장 · 조회만 503 이 되는 일이 없다.
feign-client:
  target-services:
    surveillance-service: ${SURVEILLANCE_SERVICE_APP_NAME:surveillance-service}

# 서비스 간 호출 서킷 — InternalClientSupport.requestAndUnwrap 이 대상 논리명의 인스턴스로 감싼다.
# 5xx · timeout · 응답 해석 실패만 실패로 센다. 4xx(FeignClientException)는 상대가 요청을 읽고 거절한 것이라 집계하지 않는다.
# 수치는 보수적인 기본값이다: 최근 20건 중 최소 10건이 쌓인 뒤 절반이 실패하면 10초 동안 열어 503 으로 바로 끝내고(상대가 회복할 틈을 준다),
# 반열림에서 3건으로 회복을 확인한다. 느린 호출은 따로 세지 않는다 — read timeout(3s)을 넘으면 이미 실패다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      # 내 동네 · 관심 동네의 행정동 확인과 원시 보고 파기가 함께 쓴다. 열려 있으면 동네 저장은 거부(검증 못 한 코드는 저장하지 않는다)되고
      # 조회는 503 이며, 파기 스케줄러는 시도로 세지 않고 그 회차를 멈춘다.
      surveillance-service:
        base-config: default
