# 로컬 인프라를 두지 않고 팀 개발 서버에 바로 배포하므로 local 프로파일이 없다. 기본값은 dev 다.
# 값은 env 로 받고, 배포 때 Vault 에서 주입한다.
spring:
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      # Redis 는 템플릿으로 TTL 키-값만 다룬다. 리포지터리 스캔은 JPA 만 하게 해서, 리포지터리가 어느 저장소 것인지 헷갈릴 여지를 없앤다.
      repositories:
        enabled: false

infra:
  redis:
    # 게이트웨이와 같은 값이어야 한다 — access token 블랙리스트 키를 auth 가 쓰고 게이트웨이가 읽는다.
    key-prefix: ${REDIS_KEY_PREFIX:sneezecast}

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN
