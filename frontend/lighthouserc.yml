# Lighthouse CI 설정 (#177). 측정 방법 · 예산 · 기준선은 docs/performance.md 가 정본이다.
#
# - 프로덕션 빌드(`pnpm build`)를 `next start -p 3100` 으로 띄워 잰다. 개발 서버는 재지 않는다.
# - Lighthouse 기본 설정 = 모바일(느린 4G · CPU 4배 감속 흉내, 시뮬레이션 쓰로틀링)이다. 프리셋을 바꾸지 않는다.
# - URL 마다 3회 재고, 요약(scripts/lighthouse-summary.mjs)은 각 값의 중앙값을 쓴다.
# - 결과는 `.lighthouseci/` 에만 남긴다. 외부 업로드(temporary-public-storage · LHCI 서버)는 하지 않는다.
ci:
  collect:
    startServerCommand: pnpm exec next start -p 3100
    startServerReadyPattern: Ready in
    startServerReadyTimeout: 60000
    numberOfRuns: 3
    url:
      - http://localhost:3100/start
      - http://localhost:3100/login
      # 쿠키(sc_visited)가 있어 시작 화면으로 보내지 않는다 — 비회원 둘러보기 홈
      - http://localhost:3100/
      - http://localhost:3100/map
      - http://localhost:3100/official
      - http://localhost:3100/install
      # 목 회원 홈(목데이터 모드에서만 듣는 QA 덮어쓰기)
      - http://localhost:3100/?mock-auth=member
    settings:
      # sc_visited=1: 다시 온 사람으로 보여 `/` 가 `/start` 로 307 되지 않게 한다(features/onboarding/first-visit.ts).
      # sc_data_source=mock: 빌드 환경변수와 무관하게 목데이터로 잰다. 출처를 바꿀 수 있는 사이트 주소로 빌드했을 때만 듣는다
      # (로컬 기본값 · dev 웹 — src/lib/data-source.ts). 운영 주소로 빌드하면 실데이터가 되어 수치가 달라진다.
      extraHeaders: '{"Cookie":"sc_visited=1; sc_data_source=mock"}'
  assert:
    # **경고만 낸다(차단하지 않는다).** 모든 항목이 `warn` 이라 넘어도 종료 코드는 0 이다.
    # 값은 CI 기준선(docs/performance.md "CI 기준선", GitHub ubuntu 러너)보다 조금 느슨하게 잡았다 — 러너는 회차마다 TBT · 점수가 튄다.
    # 화면마다 따로 두지 않고 모든 URL 에 같은 값을 건다. 값을 바꾸면 docs/performance.md "예산" 표도 고친다.
    assertions:
      categories:performance: [warn, { minScore: 0.83, aggregationMethod: median }]
      categories:accessibility: [warn, { minScore: 0.95, aggregationMethod: median }]
      categories:best-practices: [warn, { minScore: 0.95, aggregationMethod: median }]
      categories:seo: [warn, { minScore: 0.95, aggregationMethod: median }]
      largest-contentful-paint: [warn, { maxNumericValue: 4200, aggregationMethod: median }]
      cumulative-layout-shift: [warn, { maxNumericValue: 0.05, aggregationMethod: median }]
      total-blocking-time: [warn, { maxNumericValue: 200, aggregationMethod: median }]
      # 로드 중 받은 스크립트 전송량(바이트, 압축 뒤) — 225 KiB
      resource-summary:script:size: [warn, { maxNumericValue: 230400, aggregationMethod: median }]
  upload:
    target: filesystem
    outputDir: .lighthouseci/report
